<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Pháo hoa Chúc mừng - Dừng giữa màn hình</title>
<style>
    :root {
        /* THAY LINK ẢNH NỀN TẠI ĐÂY */
        --bg-image: url('/hahaa.jpg');
    }

    body {
        margin: 0;
        overflow: hidden;
        background-color: #000; 
        background-image: var(--bg-image);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family: 'Arial', sans-serif;
    }

    body::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.5); 
        z-index: 0;
    }

    canvas {
        display: block;
        position: absolute;
        top: 0; left: 0;
        z-index: 1;
    }

    /* CHỮ CHẠY LÊN VÀ DỪNG GIỮA MÀN HÌNH */
    .message {
        position: absolute;
        width: 90%;
        left: 50%; /* Căn giữa theo chiều ngang */
        text-align: center;
        font-size: 6vw; 
        line-height: 1.3;
        font-weight: 900;
        color: #ffffff;
        pointer-events: none;
        z-index: 10;
        text-transform: uppercase;
        
        text-shadow: 
            0 0 10px rgba(255, 255, 255, 0.9),
            0 0 20px rgba(255, 215, 0, 0.8),
            0 0 40px rgba(255, 140, 0, 0.6);
        
        /* - 4s: Thời gian chạy lên
           - ease-out: Chạy nhanh lúc đầu, chậm dần khi dừng
           - forwards: Giữ lại trạng thái ở frame cuối cùng (dừng lại)
        */
        animation: moveAndStop 4s ease-out forwards;
        opacity: 0;
    }

    @media (max-width: 600px) {
        .message {
            font-size: 10vw;
            line-height: 1.2;
        }
    }

    @keyframes moveAndStop {
        0% {
            top: 120%; /* Bắt đầu từ dưới màn hình */
            transform: translate(-50%, 0) scale(0.7);
            opacity: 0;
        }
        100% {
            top: 50%; /* Dừng lại ở giữa */
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
    }
</style>
</head>
<body>

<canvas id="fireworks"></canvas>
<div class="message">
    CHÚC MỪNG<br>
    CHIẾN DỊCH THÀNH CÔNG
</div>

<script>
// Giữ nguyên toàn bộ logic Script pháo hoa của bạn
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let width, height;
function setCanvasSize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
setCanvasSize();
window.addEventListener("resize", setCanvasSize);

let fireworks = [];
let particles = [];
const random = (min, max) => Math.random() * (max - min) + min;

const colorPalettes = [
    { hue: 45, variation: 10 }, 
    { hue: 0, variation: 10 },  
    { hue: 200, variation: 5, saturation: 10 }
];

class Firework {
    constructor() {
        this.x = random(width * 0.1, width * 0.9);
        this.y = height;
        this.targetY = random(height * 0.1, height * 0.5);
        this.palette = colorPalettes[Math.floor(Math.random() * colorPalettes.length)];
        this.speed = random(10, 15);
        this.angle = -Math.PI / 2 + random(-0.1, 0.1);
        this.velocity = { x: Math.cos(this.angle) * this.speed, y: Math.sin(this.angle) * this.speed };
        this.alive = true;
    }
    update() {
        this.velocity.y += 0.15;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        if (this.velocity.y >= 0 || this.y <= this.targetY) {
            this.explode();
            this.alive = false;
        }
    }
    draw() {
        ctx.fillStyle = "white";
        ctx.fillRect(this.x, this.y, 2, 2);
    }
    explode() {
        for (let i = 0; i < 150; i++) {
            let p_hue = this.palette.hue + random(-this.palette.variation, this.palette.variation);
            particles.push(new Particle(this.x, this.y, p_hue));
        }
    }
}

class Particle {
    constructor(x, y, hue) {
        this.x = x; this.y = y;
        this.angle = random(0, Math.PI * 2);
        this.speed = random(1, 8);
        this.velocity = { x: Math.cos(this.angle) * this.speed, y: Math.sin(this.angle) * this.speed };
        this.friction = 0.95;
        this.gravity = 0.12;
        this.hue = hue;
        this.alpha = 1;
        this.decay = random(0.01, 0.02);
        this.history = [];
        this.historyLength = 15;
    }
    update() {
        this.history.push({x: this.x, y: this.y});
        if(this.history.length > this.historyLength) this.history.shift();
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.velocity.y += this.gravity;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= this.decay;
    }
    draw() {
        if (this.alpha <= 0) return;
        ctx.beginPath();
        for (let i = 0; i < this.history.length; i++) {
            let point = this.history[i];
            let op = (i / this.history.length) * this.alpha;
            ctx.strokeStyle = `hsla(${this.hue}, 100%, 70%, ${op})`;
            ctx.lineWidth = 2.5;
            if (i === 0) ctx.moveTo(point.x, point.y);
            else ctx.lineTo(point.x, point.y);
        }
        ctx.stroke();
    }
}

function animate() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, width, height); 
    ctx.globalCompositeOperation = 'lighter';
    if (Math.random() < 0.05) fireworks.push(new Firework());
    fireworks = fireworks.filter(fw => { fw.update(); fw.draw(); return fw.alive; });
    particles = particles.filter(p => { p.update(); p.draw(); return p.alpha > 0; });
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
